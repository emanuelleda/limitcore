name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and Redis integration tests
        run: mvn -B -ntp verify
      - name: Generate CycloneDX SBOM
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
          test -s target/bom.json && test -s target/bom.xml
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build versioned application image
        run: docker build --pull --build-arg APP_VERSION=0.1.1 -t limitcore:ci .
      - name: Scan runtime image for fixable severe vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: limitcore:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Verify non-root runtime and memory limits
        run: |
          user="$(docker inspect -f '{{.Config.User}}' limitcore:ci)"
          test "$user" = 10001
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' limitcore:ci | grep -q 'MaxRAMPercentage=75'
          # VPS compose uses a shell entrypoint to load file-backed secrets.
          docker run --rm --entrypoint /bin/sh limitcore:ci -ec 'test "$(id -u)" = 10001 && command -v cat >/dev/null'


  release-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify non-SNAPSHOT SemVer release artifact (dry run)
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion=0.1.1 -DgenerateBackupPoms=false
          mvn -B -ntp package -DskipTests
          test -s target/limitcore-0.1.1.jar

  release-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test release gate on successful and failing checks
        run: |
          bash scripts/test-release-checks.sh
          bash scripts/test-repository-readiness.sh
      - name: Validate deployment bundle and OpenAPI contract
        run: |
          bash scripts/test-vps-deploy.sh
          ruby -ryaml -e '
            src = File.read("docs/openapi.yaml")
            abort "Duplicate response schema" unless src.scan(/^    CheckResponse:/).size == 1
            abort "Duplicate request schema" unless src.scan(/^    CheckRequest:/).size == 1
            doc = YAML.load_file("docs/openapi.yaml")
            schemas = doc.fetch("components").fetch("schemas")
            request = schemas.fetch("CheckRequest").fetch("properties").fetch("key")
            response = schemas.fetch("CheckResponse").fetch("properties")
            abort "Invalid request pattern" unless request["pattern"] == "^[a-zA-Z0-9:_-]{1,128}$"
            abort "Invalid response" unless response["allowed"]["type"] == "boolean"
            abort "Invalid algorithm enum" unless response["algorithm"]["enum"].size == 3
            puts "OpenAPI contract validation passed"
          '

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.4.2 \
            check config /etc/prometheus/prometheus.yml
