name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and Redis integration tests
        run: mvn -B -ntp verify
      - name: Generate CycloneDX SBOM
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
          test -s target/bom.json && test -s target/bom.xml
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned application image
        run: docker build --pull --build-arg APP_VERSION=0.1.1 -t limitcore:ci .
      - name: Scan runtime image for fixable severe vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: limitcore:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Verify non-root runtime and memory limits
        run: |
          user="$(docker inspect -f '{{.Config.User}}' limitcore:ci)"
          test "$user" = 10001
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' limitcore:ci | grep -q 'MaxRAMPercentage=75'


  release-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify non-SNAPSHOT SemVer release artifact (dry run)
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion=0.1.1 -DgenerateBackupPoms=false
          mvn -B -ntp package -DskipTests
          test -s target/limitcore-0.1.1.jar

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.4.2 \
            check config /etc/prometheus/prometheus.yml
