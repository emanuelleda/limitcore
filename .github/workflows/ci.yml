name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and Redis integration tests
        run: mvn -B -ntp verify
      - name: Generate CycloneDX SBOM
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
          test -s target/bom.json && test -s target/bom.xml
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --pull -t limitcore:ci .
      - name: Verify non-root runtime and memory limits
        run: |
          user="$(docker inspect -f '{{.Config.User}}' limitcore:ci)"
          test "$user" = 10001
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' limitcore:ci | grep -q 'MaxRAMPercentage=75'
