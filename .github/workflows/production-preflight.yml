name: Production Preflight (Repository Controls)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repository-controls:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit branch protection, required checks, Sonar and native dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-repository-readiness.sh
