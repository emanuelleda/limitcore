name: Production Preflight (Repository Controls)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repository-controls:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit branch protection, required checks, Sonar and native dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-repository-readiness.sh
