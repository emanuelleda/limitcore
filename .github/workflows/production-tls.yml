name: Production TLS and Authentication
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build production artifact
        run: mvn -B -ntp package -DskipTests
      - name: Exercise production profile against authenticated Redis TLS
        run: bash scripts/production-tls-smoke-ci.sh
