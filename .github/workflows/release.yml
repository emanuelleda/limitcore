name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Exigir tag derivada da branch principal
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Releases devem referenciar commits da main"
            exit 1
          }
      - name: Require successful checks on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-checks.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Preparar versão imutável
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A versão deve seguir vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Testar e empacotar
        run: mvn -B -ntp verify
      - name: Exigir Quality Gate SonarQube aprovado
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [[ -z "$SONAR_PROJECT_KEY" || -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure SONAR_PROJECT_KEY e SONAR_TOKEN antes de publicar uma release"
            exit 1
          fi
          PARAMS=("-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.qualitygate.wait=true")
          if [[ -n "$SONAR_ORGANIZATION" ]]; then PARAMS+=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          if [[ -n "$SONAR_HOST_URL" ]]; then PARAMS+=("-Dsonar.host.url=$SONAR_HOST_URL"); fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar "${PARAMS[@]}"
      - name: Gerar SBOM CycloneDX
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
      - name: Publicar artefatos da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/limitcore-${GITHUB_REF_NAME#v}.jar" target/bom.json target/bom.xml \
            --generate-notes --verify-tag
