name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testar e empacotar
        run: mvn -B -ntp verify
      - name: Gerar SBOM CycloneDX
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DskipTests
      - name: Publicar artefatos da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/*.jar target/bom.json target/bom.xml \
            --generate-notes --verify-tag
