name: Redis Sentinel Failover
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'scripts/sentinel-failover-ci.sh'
      - '.github/workflows/sentinel.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'scripts/sentinel-failover-ci.sh'
      - '.github/workflows/sentinel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package API
        run: mvn -B -ntp package -DskipTests
      - name: Simulate master election with 3 Sentinel voters
        run: bash scripts/sentinel-failover-ci.sh
