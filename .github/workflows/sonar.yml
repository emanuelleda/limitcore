name: SonarQube
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Aviso se Sonar não estiver conectado
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == ''
        run: echo "SonarQube não foi executado: configure SONAR_TOKEN (secret) e SONAR_PROJECT_KEY (variable)." >> "$GITHUB_STEP_SUMMARY"
      - name: Testes e cobertura
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: mvn -B -ntp verify
      - name: Analisar no SonarQube ou SonarCloud
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          set -eu
          PARAMS=("-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.qualitygate.wait=true")
          if [ -n "$SONAR_ORGANIZATION" ]; then PARAMS+=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          if [ -n "$SONAR_HOST_URL" ]; then PARAMS+=("-Dsonar.host.url=$SONAR_HOST_URL"); fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar "${PARAMS[@]}"
