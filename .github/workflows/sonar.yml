name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonar:
    # Never provide organization credentials to untrusted fork pull requests.
    if: vars.SONAR_PROJECT_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exigir credencial SonarQube
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_PROJECT_KEY está definido, mas SONAR_TOKEN não está disponível"
            exit 1
          fi
      - name: Testes e cobertura
        run: mvn -B -ntp verify
      - name: Analisar no SonarQube ou SonarCloud
        run: |
          set -eu
          PARAMS=("-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.qualitygate.wait=true")
          if [ -n "$SONAR_ORGANIZATION" ]; then PARAMS+=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          if [ -n "$SONAR_HOST_URL" ]; then PARAMS+=("-Dsonar.host.url=$SONAR_HOST_URL"); fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar "${PARAMS[@]}"
