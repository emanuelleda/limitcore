openapi: 3.0.3
info:
  title: LimitCore API
  version: 0.1.0
  description: API de decisão para controle distribuído de requisições. A resposta informa a decisão em JSON; uma decisão negativa não utiliza HTTP 429.
servers:
  - url: http://localhost:8080
paths:
  /v1/limits/check:
    post:
      summary: Avaliar uma decisão de limitação de requisições
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: Decisão avaliada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          description: Requisição inválida
        '401':
          description: Chave de API ausente ou inválida
        '500':
          description: Falha interna
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CheckRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9:_-]+$'
    CheckResponse:
      type: object
      required: [allowed, algorithm]
      properties:
        allowed:
          type: boolean
        algorithm:
          type: string
          enum: [fixed-window, token-bucket, sliding-window]
