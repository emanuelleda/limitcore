openapi: 3.0.3
info:
  title: LimitCore API
  version: 0.1.0
  description: >-
    API distribuída para decisões de rate limiting. Uma decisão
    negativa utiliza HTTP 200 com allowed=false, não HTTP 429.
servers:
  - url: http://localhost:8080
paths:
  /v1/limits/check:
    post:
      summary: Avaliar uma decisão de limitação de requisições
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: Decisão avaliada; allowed=false indica quota ou cardinalidade esgotada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          description: Requisição inválida
        '401':
          description: Chave de API ausente ou inválida
        '413':
          description: Corpo da requisição maior que 1 KiB
        '503':
          description: Redis indisponível; nenhuma autorização presumida
        '500':
          description: Erro interno inesperado
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CheckRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9:_-]{1,128}$'
          description: >-
            Identificador do consumidor em modo identifier. Quando
            LIMITCORE_KEY_SCOPE=tenant (padrão do perfil production),
            o campo é validado mas não altera a quota compartilhada pelo tenant.
    CheckResponse:
      type: object
      required: [allowed, algorithm]
      properties:
        allowed:
          type: boolean
        algorithm:
          type: string
          enum: [fixed-window, token-bucket, sliding-window]
