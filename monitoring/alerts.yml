groups:
  - name: limitcore-service
    rules:
      - alert: LimitCoreUnavailable
        expr: up{job="limitcore"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "LimitCore não está respondendo ao Prometheus"
          description: "Investigue conectividade, disponibilidade da API e configuração do scrape."
      - alert: LimitCoreHighErrorRatio
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/v1/limits/check",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{uri="/v1/limits/check"}[5m])), 0.001)
          > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Mais de 1% das respostas de decisão são 5xx"
      - alert: LimitCoreHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{uri="/v1/limits/check"}[5m])
            )
          ) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Latência HTTP p95 acima de 500 ms"
      - alert: LimitCoreAuthorizationFailures
        expr: sum(rate(limitcore_decisions_total{outcome="unauthorized"}[5m])) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Aumento de falhas de credenciais no LimitCore"
