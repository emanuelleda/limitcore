spring:
  application:
    name: limitcore
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
limitcore:
  api-key: ${LIMITCORE_API_KEY:}
  tenants: ${LIMITCORE_TENANTS:}
  tenant-capacities: ${LIMITCORE_TENANT_CAPACITIES:}
  max-active-keys: ${LIMITCORE_MAX_ACTIVE_KEYS:1000}
  capacity: ${LIMITCORE_CAPACITY:100}
  window-seconds: ${LIMITCORE_WINDOW_SECONDS:60}
  algorithm: ${LIMITCORE_ALGORITHM:fixed-window}
management:
  tracing:
    sampling:
      probability: ${LIMITCORE_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${LIMITCORE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
server:
  error:
    include-message: never
